<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Studydeck keeps a CBSE student's timetable, revision plan, assignments and notes in one place. The AI study desk answers from your own notes."
    />
    <meta name="theme-color" content="#f3f1ea" />
    <title>Studydeck: timetable, deadlines and notes</title>
    <script>
      // Before the first paint, so a dark screen never flashes light.
      try {
        var picked = localStorage.getItem('studydeck:theme')
        var dark =
          picked === 'dark' ||
          (picked !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#121915' : '#f3f1ea')
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
